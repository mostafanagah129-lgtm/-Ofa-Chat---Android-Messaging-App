name: Build Ofa Chat APK (Supabase)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack starter project
        run: |
          unzip -q Ofa_Chat_Android_Starter_v2.zip -d unpacked
          cp -R unpacked/ofa_chat_android/. .

      - name: Apply Supabase migration patch
        run: |
          unzip -q Ofa_Chat_Supabase_Patch.zip -d supabase-patch
          cp -R supabase-patch/. .

      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: OfaChat-Supabase-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
