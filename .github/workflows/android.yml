
name: Build Ofa Chat APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Ofa Chat project
        run: |
          unzip -q Ofa-Chat-Full-Foundation.zip -d extracted
          test -d extracted/OfaChat-Full-Foundation/android
          cp -R extracted/OfaChat-Full-Foundation/android ./android

      - name: Verify Android files
        run: |
          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OfaChat-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
